version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=sifin-bd-lk4s4r
      - DB_PORT=3306
      - DB_DATABASE=sistema_financiero_anf115
      - DB_USERNAME=root
      - DB_PASSWORD=1234
    networks:
      - laravel

networks:
  laravel:
    driver: bridge