version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=sifin-bd-lk4s4r
      - DB_PORT=3306
      - DB_DATABASE=sistema_financiero_anf115
      - DB_USERNAME=root
      - DB_PASSWORD=1234
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`sifin-anf-jfanom-a977cd-129-159-33-205.traefik.me`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge